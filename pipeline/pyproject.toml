[project]
name = "blink"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["astropy", "numpy", "scipy", "requests", "pillow", "reproject"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["blink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
